# What every push and pull request must pass: the code's shape, the tests, and a
# package build for each platform we ship. Tags are left out: release.yml owns
# them and would only build the same two archives again.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: gofmt, vet, test (race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  test:
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 ./...

  build:
    name: build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux/amd64, os: ubuntu-latest, platforms: linux/amd64 }
          - { name: windows/amd64, os: windows-latest, platforms: windows/amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Packaging is what the release does; here it only has to work, so the
      # disk images and the Windows installer are left out (the installer would
      # download NSIS on every push).
      - name: package
        run: go tool mygo build -platform "${{ matrix.platforms }}" -skip-dmg -skip-installer -o dist
      - name: list
        run: find dist -type f | sort