# Pushing a tag vX.Y.Z builds linux/amd64 and windows/amd64 and publishes a
# GitHub release with one portable .zip per platform plus SHA256SUMS: no
# installer, no .deb. The tag is the release name; mygo.json carries the version
# the artifacts are named after, and the two must agree.
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: check the tag against mygo.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $tag is not vX.Y.Z"
            exit 1
          fi
          version="${tag#v}"
          configured="$(jq -r .version mygo.json)"
          if [[ "$version" != "$configured" ]]; then
            echo "::error::tag $tag but mygo.json says $configured: bump mygo.json, commit, then tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.name }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux/amd64, slug: linux-amd64, os: ubuntu-latest, platforms: linux/amd64 }
          - { name: windows/amd64, slug: windows-amd64, os: windows-latest, platforms: windows/amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: package
        run: go tool mygo build -platform "${{ matrix.platforms }}" -skip-installer -skip-dmg -o dist
      # A release carries one portable archive per platform, both .zip: the
      # executable with the native library beside it, unpacked anywhere. No
      # installer, no .deb, no PKGBUILD: mygo build still writes those, they are
      # just not release assets.
      - name: portable (linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          mkdir -p out
          root="$PWD"
          zip="out/wt-go_${{ needs.preflight.outputs.version }}_linux-amd64_portable.zip"
          (cd dist/linux-amd64 && zip -qr "$root/$zip" .)
          # The archive has to hold the executable and the native library, or
          # it is not portable: fail rather than publish an empty one.
          unzip -l "$zip"
          for need in wt-go libghostty-vt.so LICENSE; do
            unzip -Z1 "$zip" | grep -qx "$need" || { echo "::error::$zip has no $need"; exit 1; }
          done
      - name: portable (windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $version = '${{ needs.preflight.outputs.version }}'
          $root = (Get-Location).Path
          $app = Join-Path $root 'dist/windows-amd64'
          $zip = Join-Path $root "out/wt-go_${version}_windows-amd64_portable.zip"
          New-Item -ItemType Directory -Force (Join-Path $root 'out') | Out-Null
          # -Force: the dotfile (.mygo-files) ships too, and a bare
          # `dist/windows-amd64/*` glob would drop it.
          Compress-Archive -Force -DestinationPath $zip `
            -Path (Get-ChildItem $app -Force).FullName
          # The archive has to hold the executable and the native library, or
          # it is not portable: fail rather than publish an empty one.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead($zip).Entries | ForEach-Object FullName
          foreach ($need in 'wt-go.exe', 'ghostty-vt.dll', 'LICENSE', '.mygo-files') {
            if ($names -notcontains $need) { Write-Error "$zip has no $need"; exit 1 }
          }
          $names
          Get-Item $zip | Select-Object Name, Length
      - name: list
        run: |
          set -euo pipefail
          ls -l out
          [[ -n "$(ls -A out)" ]] || { echo "::error::no portable archive was made"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.slug }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "wt-go ${{ needs.preflight.outputs.version }}" \
            --generate-notes